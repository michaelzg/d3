<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tempest Atlas</title>
<meta name="description" content="An interactive globe of every named hurricane since 2020, explorable across time and space.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ffffff;
    --paper-2:#f7f7f5;
    --ink:#121212;
    --ink-70:#4d4d4d;
    --ink-50:#727272;
    --ink-35:#9a9a9a;
    --rule:#e2e2e2;
    --rule-2:#cfcfcf;
    --td:#b9b9b9;
    --ts:#82b8e0;
    --c1:#efcd3a;
    --c2:#f29e38;
    --c3:#e8672a;
    --c4:#cf2f24;
    --c5:#7d1010;
    --panel-w:380px;
    --tl-h:112px;
    --sans:'Libre Franklin',Helvetica,Arial,sans-serif;
    --serif:'Newsreader',Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:13px;overflow:hidden;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  #stage{position:fixed;inset:0;overflow:hidden;background:var(--paper)}
  #globe{position:absolute;inset:0;display:block;cursor:grab;touch-action:none}
  #globe.grabbing{cursor:grabbing}
  #globe.pointing{cursor:pointer}

  /* ---------- masthead ---------- */
  #mast{position:absolute;left:40px;top:34px;right:calc(var(--panel-w) + 24px);pointer-events:none;z-index:3}
  #mast > *{pointer-events:auto}
  .eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-50);display:flex;align-items:center;gap:10px}
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--ink)}
  #title{font-family:var(--serif);font-weight:400;font-size:clamp(40px,4.6vw,64px);line-height:1;letter-spacing:-.015em;margin-top:14px;max-width:620px;color:var(--ink)}
  #title em{font-style:italic;font-weight:400}
  #subtitle{margin-top:12px;font-size:13px;color:var(--ink-70);display:flex;flex-wrap:wrap;gap:6px 0;align-items:center;line-height:1.5}
  #subtitle .sep{display:inline-block;width:3px;height:3px;border-radius:50%;background:var(--ink-35);margin:0 10px}
  #back{display:none;margin-bottom:14px;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);padding:7px 12px 7px 9px;border:1px solid var(--rule-2);border-radius:999px;background:var(--paper);transition:background .2s,border-color .2s}
  #back:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  #back svg{width:11px;height:11px}
  body.storm #back{display:inline-flex}
  .badge{display:inline-flex;align-items:center;gap:7px;padding:3px 9px 3px 7px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);border:1px solid var(--rule-2);background:var(--paper)}
  .badge i{width:9px;height:9px;border-radius:50%;background:var(--cc,var(--ink))}

  .reveal{opacity:0;transform:translateY(8px);animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes rise{to{opacity:1;transform:none}}

  /* ---------- side panel ---------- */
  #panel{position:absolute;top:0;right:0;bottom:0;width:var(--panel-w);z-index:4;display:flex;flex-direction:column;background:var(--paper);border-left:1px solid var(--rule)}
  #filters{padding:28px 24px 18px;border-bottom:1px solid var(--rule)}
  .frow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .frow + .frow{margin-top:10px}
  .flabel{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-50);width:52px;flex:none}
  .chip{font-size:12px;font-weight:500;padding:5px 10px;border:1px solid var(--rule-2);border-radius:999px;color:var(--ink-70);transition:all .18s;background:var(--paper)}
  .chip:hover{border-color:var(--ink);color:var(--ink)}
  .chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  #count{padding:16px 24px 10px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-50);display:flex;justify-content:space-between;align-items:center;gap:10px}
  #count b{color:var(--ink);font-weight:700}
  #sort{display:flex;gap:10px;flex:none}
  #sort button{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-35);padding:3px 0;border-bottom:1.5px solid transparent;white-space:nowrap}
  #sort button.on{color:var(--ink);border-bottom-color:var(--ink)}
  #cards{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#d0d0d0 transparent;padding-bottom:40px}
  #cards::-webkit-scrollbar{width:6px}
  #cards::-webkit-scrollbar-thumb{background:#d0d0d0;border-radius:3px}
  .card{position:relative;padding:18px 24px 18px 28px;border-bottom:1px solid var(--rule);cursor:pointer;transition:background .2s;animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cc);opacity:0;transform:scaleY(.3);transition:opacity .25s,transform .35s cubic-bezier(.2,.7,.2,1)}
  .card:hover{background:var(--paper-2)}
  .card:hover::before{opacity:.6;transform:scaleY(1)}
  .card.sel{background:var(--paper-2)}
  .card.sel::before{opacity:1;transform:scaleY(1)}
  .card-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .card h3{font-family:var(--serif);font-weight:500;font-size:26px;line-height:1;letter-spacing:-.01em;color:var(--ink);display:flex;align-items:center;gap:9px}
  .live-dot{display:none;width:7px;height:7px;border-radius:50%;background:var(--cc);animation:pulse 1.3s ease-in-out infinite}
  .card.live .live-dot{display:block}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
  .cat{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);white-space:nowrap;display:flex;align-items:center;gap:6px}
  .cat i{width:8px;height:8px;border-radius:50%;background:var(--cc)}
  .card-meta{margin-top:7px;font-size:11.5px;color:var(--ink-50)}
  .card-bottom{display:flex;align-items:flex-end;justify-content:space-between;margin-top:14px;gap:12px}
  .stats{display:flex;gap:16px}
  .stat{display:flex;flex-direction:column;gap:2px}
  .stat b{font-weight:600;font-size:15px;color:var(--ink);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .stat b small{font-size:9.5px;font-weight:500;color:var(--ink-35);margin-left:2px;letter-spacing:.06em}
  .stat span{font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-35)}
  .spark{flex:none;width:104px;height:30px;overflow:visible}
  .spark path.a{fill:var(--cc);opacity:.18}
  .spark path.l{fill:none;stroke:var(--cc);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
  .spark line{stroke:var(--rule-2);stroke-width:1}
  .empty{padding:60px 24px;text-align:center;color:var(--ink-50);font-family:var(--serif);font-style:italic;font-size:22px}

  /* ---------- timeline ---------- */
  #timeline{position:absolute;left:0;right:var(--panel-w);bottom:0;height:var(--tl-h);z-index:3;display:flex;align-items:stretch;background:var(--paper);border-top:1px solid var(--rule);padding:0 28px 0 40px}
  #transport{display:flex;align-items:center;gap:16px;padding-right:20px;border-right:1px solid var(--rule);margin:22px 0 20px;flex:none}
  #play{width:44px;height:44px;border-radius:50%;background:var(--ink);display:grid;place-items:center;transition:transform .15s;flex:none}
  #play:hover{transform:scale(1.06)}
  #play svg{width:14px;height:14px;fill:var(--paper)}
  #play .ic-pause,#play .ic-replay{display:none}
  body.playing #play .ic-play{display:none}
  body.playing #play .ic-pause{display:block}
  body.ended:not(.playing) #play .ic-play{display:none}
  body.ended:not(.playing) #play .ic-replay{display:block}
  #clock{display:flex;flex-direction:column;gap:4px;min-width:132px}
  #clock .d{font-size:14px;font-weight:700;letter-spacing:.02em;color:var(--ink);font-variant-numeric:tabular-nums}
  #clock .h{font-size:11px;color:var(--ink-50);font-variant-numeric:tabular-nums;white-space:nowrap}
  #speeds{display:flex;flex-direction:column;gap:1px}
  #speeds button{font-size:10px;font-weight:600;color:var(--ink-35);padding:1px 6px;text-align:left;border-radius:3px;font-variant-numeric:tabular-nums}
  #speeds button.on{color:var(--paper);background:var(--ink)}
  #track{flex:1;position:relative;margin:16px 0 0 22px;min-width:120px}
  #track svg{width:100%;height:100%;overflow:visible;cursor:ew-resize;display:block}
  #legend{position:absolute;left:40px;bottom:calc(var(--tl-h) + 14px);display:flex;gap:14px;z-index:3;pointer-events:none;flex-wrap:wrap;max-width:calc(100% - var(--panel-w) - 80px)}
  #legend span{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-50)}
  #legend i{width:16px;height:3px;background:var(--cc);display:block;border-radius:2px}
  #hint{position:absolute;right:calc(var(--panel-w) + 28px);bottom:calc(var(--tl-h) + 14px);font-size:10.5px;letter-spacing:.06em;color:var(--ink-35);pointer-events:none;z-index:2;white-space:nowrap}

  /* ---------- tooltip ---------- */
  #tip{position:absolute;z-index:5;pointer-events:none;opacity:0;transition:opacity .15s;transform:translate(14px,-50%);background:var(--paper);border:1px solid var(--rule-2);box-shadow:0 6px 24px rgba(0,0,0,.08);padding:10px 12px;border-radius:4px;min-width:150px}
  #tip.on{opacity:1}
  #tip .n{font-family:var(--serif);font-size:20px;font-weight:500;line-height:1;color:var(--ink)}
  #tip .m{margin-top:6px;font-size:11px;color:var(--ink-50)}
  #tip .m b{color:var(--ink);font-weight:700}

  #loading{position:absolute;inset:0;z-index:9;display:grid;place-items:center;background:var(--paper);transition:opacity .6s;font-family:var(--serif);font-style:italic;font-size:26px;color:var(--ink-50)}
  #loading.off{opacity:0;pointer-events:none}

  @media (max-width:1100px){
    :root{--panel-w:320px}
    #hint{display:none}
    #mast{left:28px;top:26px}
    #title{font-size:40px}
    #legend{left:28px}
    #timeline{padding-left:28px}
    #clock{min-width:112px}
    #transport{gap:12px}
  }
</style>
</head>
<body class="playing">
<div id="stage">
  <canvas id="globe"></canvas>

  <header id="mast">
    <div class="eyebrow reveal" style="animation-delay:.1s"><span class="dot"></span>Tempest Atlas<span style="color:var(--ink-35);font-weight:400">/</span><span style="font-weight:400">Named hurricanes, 2020–2025</span></div>
    <button id="back" class="reveal">
      <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7.5 1.5 3 6l4.5 4.5"/></svg>
      Back to season
    </button>
    <h1 id="title" class="reveal" style="animation-delay:.2s"></h1>
    <div id="subtitle" class="reveal" style="animation-delay:.32s"></div>
  </header>

  <div id="legend"></div>
  <div id="hint">Drag to rotate · Scroll to zoom · Space to play</div>

  <aside id="panel">
    <div id="filters">
      <div class="frow"><span class="flabel">Season</span><div id="years" class="frow" style="gap:4px"></div></div>
      <div class="frow"><span class="flabel">Basin</span><div id="basins" class="frow" style="gap:4px"></div></div>
    </div>
    <div id="count"><span><b id="n">0</b> hurricanes</span><div id="sort"><button data-s="time" class="on">By date</button><button data-s="peak">By intensity</button></div></div>
    <div id="cards"></div>
  </aside>

  <footer id="timeline">
    <div id="transport">
      <button id="play" title="Play / pause (space)">
        <svg class="ic-play" viewBox="0 0 14 14"><path d="M3.5 1.5v11l9-5.5z"/></svg>
        <svg class="ic-pause" viewBox="0 0 14 14"><path d="M2.5 1.5h3v11h-3zM8.5 1.5h3v11h-3z"/></svg>
        <svg class="ic-replay" viewBox="0 0 14 14" fill="none" stroke="#fff" stroke-width="1.5"><path d="M2.5 7a4.5 4.5 0 1 0 1.3-3.2"/><path d="M2 1.5v3h3"/></svg>
      </button>
      <div id="clock"><div class="d">—</div><div class="h">—</div></div>
      <div id="speeds"></div>
    </div>
    <div id="track"><svg></svg></div>
  </footer>

  <div id="tip"><div class="n"></div><div class="m"></div></div>
  <div id="loading">Charting the atlas…</div>
</div>

<script src="lib/d3.min.js"></script>
<script src="lib/topojson-client.min.js"></script>
<script>
(async function(){
'use strict';
const RAD = Math.PI/180;
const CATS = [
  {k:-1, short:'TD',   name:'Depression',  color:'#b9b9b9'},
  {k:0,  short:'TS',   name:'Trop. Storm', color:'#82b8e0'},
  {k:1,  short:'Cat 1',name:'Category 1',  color:'#efcd3a'},
  {k:2,  short:'Cat 2',name:'Category 2',  color:'#f29e38'},
  {k:3,  short:'Cat 3',name:'Category 3',  color:'#e8672a'},
  {k:4,  short:'Cat 4',name:'Category 4',  color:'#cf2f24'},
  {k:5,  short:'Cat 5',name:'Category 5',  color:'#7d1010'},
];
const catOf = w => w>=137?5 : w>=113?4 : w>=96?3 : w>=83?2 : w>=64?1 : w>=34?0 : -1;
const colorOf = w => CATS[catOf(w)+1].color;
const catColor = k => CATS[k+1].color;
const fmtDate = d3.utcFormat('%b %-d, %Y');
const fmtTime = d3.utcFormat('%H:%M UTC');
const fmtShort = d3.utcFormat('%b %-d');
const fmtMonth = d3.utcFormat('%b');

/* ---------------- data ---------------- */
const [rawStorms, world] = await Promise.all([
  fetch('data/storms.json').then(r=>r.json()),
  fetch('data/land-110m.json').then(r=>r.json()),
]);
const land = topojson.feature(world, world.objects.land);
const storms = rawStorms.map(s => {
  const track = s.track.map(p => ({ms:Date.parse(p[0]), lat:p[1], lon:p[2], w:p[3], p:p[4], st:p[5]}));
  const startMs = track[0].ms, endMs = track[track.length-1].ms;
  let x=0,y=0,z=0;
  for (const p of track){ const la=p.lat*RAD, lo=p.lon*RAD; x+=Math.cos(la)*Math.cos(lo); y+=Math.cos(la)*Math.sin(lo); z+=Math.sin(la); }
  const clon = Math.atan2(y,x)/RAD, clat = Math.atan2(z, Math.hypot(x,y))/RAD;
  let r = 0; for (const p of track) r = Math.max(r, d3.geoDistance([clon,clat],[p.lon,p.lat]));
  return {...s, track, startMs, endMs, center:[clon,clat], radius:r, color:catColor(s.cat), days:(endMs-startMs)/864e5,
          landfalls:s.landfalls.map(l=>({...l, ms:Date.parse(l.t)}))};
});
const YEARS = [...new Set(storms.map(s=>s.year))].sort();

/* ---------------- state ---------------- */
const S = {
  mode:'season', year:YEARS[YEARS.length-1], basin:'all', sort:'time',
  visible:[], selected:null, hover:null, hoverFromGlobe:false,
  time:0, t0:0, t1:0, playing:true, speed:1, ended:false,
  rotate:[150,-10,0], scale:0.82,
  dragging:false, lastInteract:0, fly:null, scrubbing:false,
};
const SPEEDS = [0.5,1,2,4];
const hoursPerSec = () => (S.mode==='storm' ? 9 : (S.year==='all' ? 240 : 48)) * S.speed;

/* ---------------- canvas setup ---------------- */
const stage = document.getElementById('stage');
const canvas = document.getElementById('globe');
const ctx = canvas.getContext('2d');
let W=0,H=0,DPR=1, freeW=0, cx=0, cy=0, R=0;
const panelW = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--panel-w'));
const projection = d3.geoOrthographic().clipAngle(90).precision(0.3);
const path = d3.geoPath(projection, ctx);
const graticule = d3.geoGraticule10();

function resize(){
  W = stage.clientWidth; H = stage.clientHeight; DPR = Math.min(2, window.devicePixelRatio||1);
  freeW = W - panelW();
  canvas.width = W*DPR; canvas.height = H*DPR; canvas.style.width=W+'px'; canvas.style.height=H+'px';
  cx = freeW*0.52; cy = H*0.5 - 10;
  R = Math.min(freeW*0.40, (H-170)*0.44);
}
window.addEventListener('resize', resize); resize();

/* ---------------- versor (quaternion rotation) ---------------- */
const versor = {
  fromAngles([l,p,g]){ l*=Math.PI/360; p*=Math.PI/360; g*=Math.PI/360;
    const sl=Math.sin(l),cl=Math.cos(l),sp=Math.sin(p),cp=Math.cos(p),sg=Math.sin(g),cg=Math.cos(g);
    return [cl*cp*cg+sl*sp*sg, sl*cp*cg-cl*sp*sg, cl*sp*cg+sl*cp*sg, cl*cp*sg-sl*sp*cg]; },
  toAngles([a,b,c,d]){ return [
    Math.atan2(2*(a*b+c*d), 1-2*(b*b+c*c))/RAD,
    Math.asin(Math.max(-1,Math.min(1,2*(a*c-d*b))))/RAD,
    Math.atan2(2*(a*d+b*c), 1-2*(c*c+d*d))/RAD ]; },
  slerp(a,b){ let dot=a[0]*b[0]+a[1]*b[1]+a[2]*b[2]+a[3]*b[3];
    if (dot<0){ b=b.map(v=>-v); dot=-dot; }
    if (dot>0.9995) return t=>{ const r=a.map((v,i)=>v+(b[i]-v)*t); const n=Math.hypot(...r); return r.map(v=>v/n); };
    const th=Math.acos(dot), st=Math.sin(th);
    return t=>{ const A=Math.sin((1-t)*th)/st, B=Math.sin(t*th)/st; return a.map((v,i)=>v*A+b[i]*B); }; }
};
function flyTo(lon, lat, scale, dur=1900, onEnd){
  const q0=versor.fromAngles(S.rotate), q1=versor.fromAngles([-lon,-lat,0]);
  const iq=versor.slerp(q0,q1), s0=S.scale, s1=scale;
  const dist = d3.geoDistance([-S.rotate[0],-S.rotate[1]],[lon,lat]);
  const dip = Math.max(0, Math.min(s0,s1)-0.7) * Math.min(1, dist/1.2) * 0.85 + Math.min(s0,s1)*0.12*Math.min(1,dist/0.6);
  S.fly = { start:performance.now(), dur, onEnd,
    step(t){ const e=d3.easeCubicInOut(t); S.rotate=versor.toAngles(iq(e)); S.rotate[2]=0;
             S.scale = Math.max(0.6, s0+(s1-s0)*e - dip*Math.sin(Math.PI*e)); } };
}
function stormView(s){
  const want = Math.min(freeW, H-170)*0.30;
  const ang = Math.min(Math.max(s.radius,0.11)+0.07, 1.15);
  const scale = Math.max(1.25, Math.min(3.0, want/(R*Math.sin(ang))));
  return {lon:s.center[0], lat:s.center[1], scale};
}
const basinCenter = () => S.basin==='Atlantic' ? [-58,26] : S.basin==='East Pacific' ? [-118,16] : [-92,22];

/* ---------------- filtering ---------------- */
function applyFilters(){
  S.visible = storms.filter(s => (S.year==='all' || s.year===S.year) && (S.basin==='all' || s.basin===S.basin));
  if (S.sort==='peak') S.visible.sort((a,b)=>b.peak-a.peak || a.startMs-b.startMs); else S.visible.sort((a,b)=>a.startMs-b.startMs);
  if (S.visible.length){
    S.t0 = d3.min(S.visible, s=>s.startMs) - 2*864e5;
    S.t1 = d3.max(S.visible, s=>s.endMs) + 2*864e5;
  } else { S.t0 = Date.UTC(+S.year||2020,0,1); S.t1 = S.t0 + 365*864e5; }
  S.time = S.t0; S.ended=false;
  renderCards(); renderMast(); buildTimeline();
}

/* ---------------- masthead ---------------- */
const titleEl = document.getElementById('title'), subEl = document.getElementById('subtitle');
function renderMast(){
  if (S.mode==='storm' && S.selected){
    const s=S.selected;
    titleEl.innerHTML = `Hurricane <em>${s.name}</em>`;
    const lf = s.landfalls.length;
    subEl.innerHTML = `<span class="badge" style="--cc:${s.color}"><i></i>${CATS[s.cat+1].name}</span><span class="sep"></span>${s.basin}<span class="sep"></span>Peak ${s.peak} kt${s.minp?`<span class="sep"></span>${s.minp} hPa`:''}<span class="sep"></span>${fmtShort(new Date(s.startMs))} – ${fmtDate(new Date(s.endMs))}${lf?`<span class="sep"></span>${lf} landfall${lf>1?'s':''}`:''}`;
  } else {
    const n=S.visible.length, c5=S.visible.filter(s=>s.cat===5).length, major=S.visible.filter(s=>s.cat>=3).length;
    titleEl.innerHTML = S.year==='all' ? `Every hurricane, <em>2020 – ${YEARS[YEARS.length-1]}</em>` : `The <em>${S.year}</em> hurricane season`;
    subEl.innerHTML = `${n} hurricane${n===1?'':'s'}<span class="sep"></span>${major} major<span class="sep"></span>${c5} reached Category 5<span class="sep"></span>${S.basin==='all'?'Atlantic & East Pacific':S.basin}`;
  }
  document.body.classList.toggle('storm', S.mode==='storm');
}

/* ---------------- cards ---------------- */
const cardsEl = document.getElementById('cards');
const cardMap = new Map();
function sparkline(s){
  const pts = s.track.filter(p=>p.w>0);
  const x = d3.scaleLinear().domain([s.startMs,s.endMs]).range([0,104]);
  const y = d3.scaleLinear().domain([0, Math.max(150, s.peak)]).range([28,2]);
  const line = d3.line().x(p=>x(p.ms)).y(p=>y(p.w)).curve(d3.curveMonotoneX);
  const area = d3.area().x(p=>x(p.ms)).y0(28).y1(p=>y(p.w)).curve(d3.curveMonotoneX);
  return `<svg class="spark" viewBox="0 0 104 30"><line x1="0" x2="104" y1="${y(64)}" y2="${y(64)}" stroke-dasharray="2 3"/><path class="a" d="${area(pts)}"/><path class="l" d="${line(pts)}"/></svg>`;
}
function renderCards(){
  cardsEl.innerHTML=''; cardMap.clear();
  document.getElementById('n').textContent = S.visible.length;
  if (!S.visible.length){ cardsEl.innerHTML = `<div class="empty">No hurricanes match.</div>`; return; }
  S.visible.forEach((s,i)=>{
    const el=document.createElement('div'); el.className='card'; el.style.setProperty('--cc', s.color); el.style.animationDelay = Math.min(i*40, 500)+'ms';
    el.innerHTML = `
      <div class="card-top"><h3><span class="live-dot"></span>${s.name}</h3><span class="cat"><i></i>${CATS[s.cat+1].short}</span></div>
      <div class="card-meta">${s.basin} · ${fmtShort(new Date(s.startMs))} – ${fmtShort(new Date(s.endMs))}, ${s.year}</div>
      <div class="card-bottom">
        <div class="stats">
          <div class="stat"><b>${s.peak}<small>KT</small></b><span>Peak</span></div>
          <div class="stat"><b>${s.minp??'—'}<small>HPA</small></b><span>Min</span></div>
          <div class="stat"><b>${s.days.toFixed(1)}<small>D</small></b><span>Days</span></div>
        </div>${sparkline(s)}</div>`;
    el.addEventListener('click', ()=>selectStorm(s));
    el.addEventListener('mouseenter', ()=>{ S.hover=s; S.hoverFromGlobe=false; });
    el.addEventListener('mouseleave', ()=>{ if (S.hover===s) S.hover=null; });
    cardsEl.appendChild(el); cardMap.set(s.id, el);
  });
}
function updateCardStates(){
  for (const s of S.visible){
    const el=cardMap.get(s.id); if(!el) continue;
    el.classList.toggle('live', S.time>=s.startMs && S.time<=s.endMs);
    el.classList.toggle('sel', S.selected===s);
  }
}

/* ---------------- selection ---------------- */
function selectStorm(s){
  if (S.selected===s && S.mode==='storm'){ S.time=s.startMs; S.playing=true; S.ended=false; return; }
  S.selected=s; S.mode='storm'; S.hover=null;
  S.t0=s.startMs; S.t1=s.endMs; S.time=S.t0; S.playing=false; S.ended=false;
  const v=stormView(s);
  flyTo(v.lon, v.lat, v.scale, 2000, ()=>{ S.playing=true; });
  renderMast(); buildTimeline();
  const el=cardMap.get(s.id); if(el) el.scrollIntoView({block:'nearest', behavior:'smooth'});
}
function backToSeason(){
  S.mode='season'; S.selected=null;
  applyFilters();
  const c=basinCenter(); flyTo(c[0], c[1], 1, 1700);
  S.playing=true;
}
document.getElementById('back').addEventListener('click', backToSeason);

/* ---------------- filters UI ---------------- */
const yearsEl=document.getElementById('years'), basinsEl=document.getElementById('basins');
function chips(el, items, get, set){
  el.innerHTML='';
  items.forEach(it=>{ const b=document.createElement('button'); b.className='chip'+(get()===it.v?' on':''); b.textContent=it.l;
    b.addEventListener('click', ()=>{ set(it.v); chips(el,items,get,set); });
    el.appendChild(b); });
}
function setFilter(fn){ fn(); if (S.mode==='storm'){ S.mode='season'; S.selected=null; } applyFilters(); const c=basinCenter(); flyTo(c[0],c[1],1,1500); S.playing=true; }
chips(yearsEl, [{l:'All',v:'all'}, ...YEARS.map(y=>({l:String(y),v:y}))], ()=>S.year, v=>setFilter(()=>S.year=v));
chips(basinsEl, [{l:'Both',v:'all'},{l:'Atlantic',v:'Atlantic'},{l:'E. Pacific',v:'East Pacific'}], ()=>S.basin, v=>setFilter(()=>S.basin=v));
document.querySelectorAll('#sort button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#sort button').forEach(x=>x.classList.toggle('on',x===b)); S.sort=b.dataset.s;
  const t=S.time, sel=S.selected, mode=S.mode, t0=S.t0, t1=S.t1; applyFilters(); S.time=t; S.selected=sel; S.mode=mode; if(mode==='storm'){S.t0=t0;S.t1=t1;renderMast();buildTimeline();}
}));

/* legend */
document.getElementById('legend').innerHTML = CATS.slice(1).map(c=>`<span style="--cc:${c.color}"><i></i>${c.short}</span>`).join('');

/* ---------------- transport ---------------- */
const playBtn=document.getElementById('play');
function togglePlay(){ if (S.ended && !S.playing){ S.time=S.t0; S.ended=false; } S.playing=!S.playing; }
playBtn.addEventListener('click', togglePlay);
window.addEventListener('keydown', e=>{
  if (e.target.tagName==='INPUT') return;
  if (e.code==='Space'){ e.preventDefault(); togglePlay(); }
  if (e.code==='Escape' && S.mode==='storm') backToSeason();
  if (e.code==='ArrowRight'){ S.time=Math.min(S.t1, S.time + hoursPerSec()*36e5*0.25); S.ended=false; }
  if (e.code==='ArrowLeft'){ S.time=Math.max(S.t0, S.time - hoursPerSec()*36e5*0.25); S.ended=false; }
});
const speedsEl=document.getElementById('speeds');
function renderSpeeds(){ speedsEl.innerHTML=''; SPEEDS.forEach(v=>{ const b=document.createElement('button'); b.textContent=v+'×'; b.className=v===S.speed?'on':''; b.addEventListener('click',()=>{S.speed=v;renderSpeeds();}); speedsEl.appendChild(b); }); }
renderSpeeds();
const clockD=document.querySelector('#clock .d'), clockH=document.querySelector('#clock .h');

/* ---------------- timeline (SVG) ---------------- */
const tlSvg = d3.select('#track svg');
let tlX = null, tlPlayhead=null, tlW=0, tlH=0;
function buildTimeline(){
  const box=document.getElementById('track').getBoundingClientRect(); tlW=box.width; tlH=box.height;
  tlSvg.selectAll('*').remove();
  tlX = d3.scaleUtc().domain([S.t0,S.t1]).range([0,tlW]);
  const laneTop=8, laneBottom=tlH-30;
  const g=tlSvg.append('g');
  const ticks = S.mode==='storm' ? tlX.ticks(d3.utcDay.every(Math.max(1,Math.round((S.t1-S.t0)/864e5/Math.max(4,tlW/90))))) : (S.year==='all'? tlX.ticks(d3.utcMonth.every(3)) : tlX.ticks(d3.utcMonth.every(1)));
  const ax=g.append('g').attr('transform',`translate(0,${tlH-24})`);
  ax.selectAll('line').data(ticks).join('line').attr('x1',d=>tlX(d)).attr('x2',d=>tlX(d)).attr('y1',0).attr('y2',5).attr('stroke','#bbb');
  ax.selectAll('text').data(ticks).join('text').attr('x',d=>tlX(d)+4).attr('y',16).attr('fill','#727272').attr('font-size',10).attr('font-weight',600).attr('letter-spacing','.06em')
    .text(d=> S.mode==='storm' ? fmtShort(d).toUpperCase() : (S.year==='all' ? (d.getUTCMonth()===0 ? d.getUTCFullYear() : fmtMonth(d).toUpperCase()) : fmtMonth(d).toUpperCase()));
  g.append('line').attr('x1',0).attr('x2',tlW).attr('y1',tlH-24).attr('y2',tlH-24).attr('stroke','#cfcfcf');

  if (S.mode==='storm' && S.selected){
    const s=S.selected, y=laneTop+(laneBottom-laneTop)/2, h=10;
    const segs=g.append('g');
    for (let i=1;i<s.track.length;i++){ const a=s.track[i-1], b=s.track[i];
      segs.append('rect').attr('x',tlX(a.ms)).attr('y',y-h/2).attr('width',Math.max(0.5,tlX(b.ms)-tlX(a.ms))).attr('height',h).attr('fill',colorOf(a.w)); }
    g.selectAll('.lf').data(s.landfalls).join('g').attr('transform',d=>`translate(${tlX(d.ms)},${y})`)
      .call(gg=>{ gg.append('line').attr('y1',-14).attr('y2',14).attr('stroke','#121212').attr('stroke-width',1.2);
                  gg.append('text').attr('y',-19).attr('text-anchor','middle').attr('fill','#121212').attr('font-size',9).attr('font-weight',700).attr('letter-spacing','.1em').text('LANDFALL'); });
  } else {
    const lanes=[]; const placed=S.visible.slice().sort((a,b)=>a.startMs-b.startMs).map(s=>{
      let li=lanes.findIndex(end=>end<=s.startMs); if(li<0){ lanes.push(0); li=lanes.length-1; } lanes[li]=s.endMs+864e5; return {s,li}; });
    const n=Math.max(1,lanes.length), lh=Math.min(5, (laneBottom-laneTop)/n - 1.5), gap=1.5, total=n*(lh+gap), top=laneTop+((laneBottom-laneTop)-total)/2;
    g.selectAll('.st').data(placed).join('rect').attr('class','st')
      .attr('x',d=>tlX(d.s.startMs)).attr('y',d=>top+d.li*(lh+gap)).attr('width',d=>Math.max(2,tlX(d.s.endMs)-tlX(d.s.startMs))).attr('height',lh).attr('rx',lh/2)
      .attr('fill',d=>d.s.color).attr('opacity',.85).style('cursor','pointer')
      .on('mouseenter',(e,d)=>{S.hover=d.s;S.hoverFromGlobe=false;}).on('mouseleave',()=>{S.hover=null;}).on('click',(e,d)=>{e.stopPropagation(); selectStorm(d.s);});
  }
  tlPlayhead=g.append('g');
  tlPlayhead.append('line').attr('y1',0).attr('y2',tlH-24).attr('stroke','#121212').attr('stroke-width',1.2);
  tlPlayhead.append('path').attr('d','M-4,0 L4,0 L0,5 Z').attr('fill','#121212');
  const scrub=e=>{ const [mx]=d3.pointer(e, tlSvg.node()); S.time=Math.max(S.t0,Math.min(S.t1,tlX.invert(mx).getTime())); S.ended=false; };
  tlSvg.on('pointerdown', e=>{ S.scrubbing=true; S.wasPlaying=S.playing; S.playing=false; scrub(e); tlSvg.node().setPointerCapture(e.pointerId); })
       .on('pointermove', e=>{ if(S.scrubbing) scrub(e); })
       .on('pointerup pointercancel', e=>{ if(!S.scrubbing) return; S.scrubbing=false; S.playing=S.wasPlaying; });
}
window.addEventListener('resize', ()=>buildTimeline());

/* ---------------- globe interaction ---------------- */
let dragStart=null;
d3.select(canvas).call(d3.drag()
  .on('start', e=>{ S.dragging=true; S.fly=null; dragStart={x:e.x,y:e.y,r:S.rotate.slice()}; canvas.classList.add('grabbing'); S.lastInteract=performance.now(); })
  .on('drag', e=>{ const k = 57/(R*S.scale)*0.9; S.rotate=[dragStart.r[0]+(e.x-dragStart.x)*k, Math.max(-88,Math.min(88,dragStart.r[1]-(e.y-dragStart.y)*k)),0]; S.lastInteract=performance.now(); })
  .on('end', ()=>{ S.dragging=false; canvas.classList.remove('grabbing'); S.lastInteract=performance.now(); }));
canvas.addEventListener('wheel', e=>{ e.preventDefault(); S.fly=null; S.scale=Math.max(0.7,Math.min(5,S.scale*Math.exp(-e.deltaY*0.0016))); S.lastInteract=performance.now(); }, {passive:false});

const tip=document.getElementById('tip');
let mouse=null;
canvas.addEventListener('mousemove', e=>{ mouse=[e.offsetX,e.offsetY]; });
canvas.addEventListener('mouseleave', ()=>{ mouse=null; if (S.hover && S.hoverFromGlobe) S.hover=null; tip.classList.remove('on'); });
canvas.addEventListener('click', ()=>{ if (S.hover && S.hoverFromGlobe && !S.dragging) selectStorm(S.hover); });
function hitTest(){
  if (!mouse || S.dragging) return;
  let best=null, bd=12*12;
  const center=[-S.rotate[0],-S.rotate[1]];
  for (const s of S.visible){
    if (s.startMs > S.time) continue;
    for (const p of s.track){ if (p.ms>S.time) break;
      if (d3.geoDistance(center,[p.lon,p.lat])>1.55) continue;
      const q=projection([p.lon,p.lat]); if(!q) continue;
      const d=(q[0]-mouse[0])**2+(q[1]-mouse[1])**2; if (d<bd){ bd=d; best={s,p,q}; } }
  }
  if (best){
    if (!S.hover || S.hoverFromGlobe){ S.hover=best.s; S.hoverFromGlobe=true; }
    canvas.classList.add('pointing');
    tip.style.left=mouse[0]+'px'; tip.style.top=mouse[1]+'px';
    tip.querySelector('.n').textContent=best.s.name;
    tip.querySelector('.m').innerHTML=`<b>${CATS[catOf(best.p.w)+1].short}</b> · ${best.p.w} kt · ${fmtShort(new Date(best.p.ms))}, ${fmtTime(new Date(best.p.ms))}`;
    tip.classList.add('on');
  } else { if (S.hoverFromGlobe){ S.hover=null; S.hoverFromGlobe=false; } canvas.classList.remove('pointing'); tip.classList.remove('on'); }
}

/* ---------------- render ---------------- */
function posAt(s, t){
  const tr=s.track; if (t<=tr[0].ms) return {lon:tr[0].lon,lat:tr[0].lat,w:tr[0].w};
  for (let i=1;i<tr.length;i++){ if (tr[i].ms>=t){ const a=tr[i-1],b=tr[i], f=(t-a.ms)/(b.ms-a.ms);
    return {lon:a.lon+(b.lon-a.lon)*f, lat:a.lat+(b.lat-a.lat)*f, w:a.w+(b.w-a.w)*f}; } }
  const l=tr[tr.length-1]; return {lon:l.lon,lat:l.lat,w:l.w};
}
function drawGlobe(){
  const sc=R*S.scale;
  projection.rotate(S.rotate).scale(sc).translate([cx,cy]);
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,W,H);

  // soft shadow under the globe
  ctx.save(); ctx.shadowColor='rgba(0,0,0,.10)'; ctx.shadowBlur=40; ctx.shadowOffsetY=12;
  ctx.fillStyle='#f6f6f4'; ctx.beginPath(); ctx.arc(cx,cy,sc,0,Math.PI*2); ctx.fill(); ctx.restore();

  // ocean
  const ocean=ctx.createRadialGradient(cx-sc*0.3,cy-sc*0.35,sc*0.1,cx,cy,sc);
  ocean.addColorStop(0,'#ffffff'); ocean.addColorStop(1,'#eeeeeb');
  ctx.fillStyle=ocean; ctx.beginPath(); ctx.arc(cx,cy,sc,0,Math.PI*2); ctx.fill();

  // graticule
  ctx.beginPath(); path(graticule); ctx.strokeStyle='rgba(0,0,0,.05)'; ctx.lineWidth=0.7; ctx.stroke();

  // land
  ctx.beginPath(); path(land); ctx.fillStyle='#e1e1dd'; ctx.fill();
  ctx.strokeStyle='#b7b7b2'; ctx.lineWidth=0.7; ctx.stroke();

  // limb
  const limb=ctx.createRadialGradient(cx,cy,sc*0.7,cx,cy,sc);
  limb.addColorStop(0,'rgba(0,0,0,0)'); limb.addColorStop(1,'rgba(0,0,0,.07)');
  ctx.fillStyle=limb; ctx.beginPath(); ctx.arc(cx,cy,sc,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx,cy,sc,0,Math.PI*2); ctx.strokeStyle='#c9c9c5'; ctx.lineWidth=1; ctx.stroke();
}
function drawStorms(now){
  const center=[-S.rotate[0],-S.rotate[1]];
  const focus = S.hover || S.selected;
  ctx.lineCap='round'; ctx.lineJoin='round';
  const heads=[];
  for (const s of S.visible){
    if (s.startMs > S.time) continue;
    const isFocus = focus===s;
    let alpha = 1;
    if (focus && !isFocus) alpha = S.mode==='storm' ? 0.12 : 0.28;
    else if (S.mode==='season' && s.endMs < S.time) alpha = 0.75;
    const segs=[];
    const tr=s.track;
    for (let i=1;i<tr.length;i++){
      const a=tr[i-1]; if (a.ms>S.time) break;
      const b=tr[i]; let bl=b.lon, bb=b.lat;
      if (b.ms>S.time){ const f=(S.time-a.ms)/(b.ms-a.ms); bl=a.lon+(b.lon-a.lon)*f; bb=a.lat+(b.lat-a.lat)*f; }
      const da=d3.geoDistance(center,[a.lon,a.lat]), db=d3.geoDistance(center,[bl,bb]);
      if (da>1.56 || db>1.56) continue;
      const pa=projection([a.lon,a.lat]), pb=projection([bl,bb]);
      if (!pa||!pb) continue;
      const fade = Math.min(1, (1.56-Math.max(da,db))/0.25);
      segs.push({pa,pb,w:a.w,fade});
    }
    const lw = isFocus ? 3 : (S.scale>1.8 ? 2.2 : 1.7);
    // white casing so tracks separate from land and from each other
    ctx.globalAlpha=alpha*0.9; ctx.strokeStyle='#ffffff'; ctx.lineWidth=lw+2.5;
    ctx.beginPath(); for (const g of segs){ ctx.moveTo(g.pa[0],g.pa[1]); ctx.lineTo(g.pb[0],g.pb[1]); } ctx.stroke();
    for (const g of segs){ ctx.beginPath(); ctx.moveTo(g.pa[0],g.pa[1]); ctx.lineTo(g.pb[0],g.pb[1]);
      ctx.strokeStyle=colorOf(g.w); ctx.globalAlpha=alpha*g.fade; ctx.lineWidth=g.w<34?lw*0.6:lw; ctx.stroke(); }
    // landfall marks
    for (const l of s.landfalls){ if (l.ms>S.time) continue; if (d3.geoDistance(center,[l.lon,l.lat])>1.5) continue;
      const q=projection([l.lon,l.lat]); if(!q) continue;
      ctx.globalAlpha=alpha; ctx.strokeStyle='#121212'; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.moveTo(q[0]-4,q[1]-4); ctx.lineTo(q[0]+4,q[1]+4); ctx.moveTo(q[0]+4,q[1]-4); ctx.lineTo(q[0]-4,q[1]+4); ctx.stroke(); }
    if (S.time<=s.endMs){ const p=posAt(s,S.time); if (d3.geoDistance(center,[p.lon,p.lat])<1.5){ const q=projection([p.lon,p.lat]); if(q) heads.push({s,p,q,alpha,isFocus}); } }
  }
  ctx.globalAlpha=1;
  for (const h of heads){
    const col=colorOf(h.p.w), r=3.5+Math.max(0,h.p.w-30)/30;
    const pulse=((now/1400)+h.s.startMs/1e7)%1;
    ctx.globalAlpha=h.alpha*(1-pulse)*0.6; ctx.strokeStyle=col; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.arc(h.q[0],h.q[1],r+2+pulse*16,0,Math.PI*2); ctx.stroke();
    ctx.globalAlpha=h.alpha; ctx.fillStyle=col; ctx.strokeStyle='#ffffff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(h.q[0],h.q[1],r,0,Math.PI*2); ctx.fill(); ctx.stroke();
    if (S.mode==='season' || h.isFocus){
      ctx.globalAlpha=h.alpha; ctx.font='700 11px "Libre Franklin", sans-serif'; ctx.textBaseline='middle';
      const label=h.s.name, wk=Math.round(h.p.w)+' kt';
      ctx.lineWidth=3; ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.strokeText(label,h.q[0]+r+7,h.q[1]);
      ctx.fillStyle='#121212'; ctx.fillText(label,h.q[0]+r+7,h.q[1]);
      if (h.isFocus){ ctx.font='500 10px "Libre Franklin", sans-serif'; ctx.strokeText(wk,h.q[0]+r+7,h.q[1]+13); ctx.fillStyle='#727272'; ctx.fillText(wk,h.q[0]+r+7,h.q[1]+13); }
    }
  }
  ctx.globalAlpha=1;
}
function updateChrome(){
  const d=new Date(S.time);
  clockD.textContent=fmtDate(d); clockH.textContent=fmtTime(d)+(S.mode==='storm'&&S.selected?`  ·  ${Math.round(posAt(S.selected,S.time).w)} kt`:'');
  if (tlPlayhead && tlX) tlPlayhead.attr('transform',`translate(${tlX(S.time)},0)`);
  document.body.classList.toggle('playing', S.playing);
  document.body.classList.toggle('ended', S.ended);
  updateCardStates();
}

let last=performance.now();
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000); last=now;
  if (S.fly){ const t=Math.min(1,(now-S.fly.start)/S.fly.dur); S.fly.step(t); if (t>=1){ const f=S.fly; S.fly=null; f.onEnd&&f.onEnd(); } }
  else if (S.mode==='season' && !S.dragging && now-S.lastInteract>6000){ S.rotate[0]+=dt*0.9; }
  if (S.playing && !S.scrubbing){
    S.time += hoursPerSec()*36e5*dt;
    if (S.time>=S.t1){ S.time=S.t1; S.playing=false; S.ended=true; }
  }
  drawGlobe(); drawStorms(now); hitTest(); updateChrome();
  requestAnimationFrame(frame);
}

/* ---------------- boot ---------------- */
applyFilters();
document.getElementById('loading').classList.add('off');
const c0=basinCenter(); flyTo(c0[0],c0[1],1,2600);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
